name: pacman contribution graph

on:
  schedule:
    - cron: "0 3 * * *" # every night
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate Pac-Man SVGs from the contribution grid
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1 # main @ 2026-11-11
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman
          player_style: aggressive

      - name: Recolor in the crema palette
        run: |
          # light: GitHub greens -> cream to espresso ramp
          sed -i -e 's/#ebedf0/#eadcc8/Ig; s/#9be9a8/#d9b48a/Ig; s/#40c463/#b08460/Ig' \
                 -e 's/#30a14e/#6e4b33/Ig; s/#216e39/#2a1e17/Ig' \
                 -e 's/#ffffff/#f5eee3/Ig; s/#000000/#2a1e17/Ig; s/#57606a/#6e5a4b/Ig' \
                 dist/pacman-contribution-graph.svg
          # dark: GitHub greens -> espresso to caramel ramp
          sed -i -e 's/#161b22/#2a1e17/Ig; s/#0e4429/#4a3a2f/Ig; s/#006d32/#6e4b33/Ig' \
                 -e 's/#26a641/#9a6438/Ig; s/#39d353/#d9b48a/Ig' \
                 -e 's/#ffffff/#c8b6a3/Ig; s/#8b949e/#c8b6a3/Ig' \
                 dist/pacman-contribution-graph-dark.svg

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
